name: Сборка генератора .NET 8
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/generator.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: microsoft/AzDevOpsDemoGenerator
          ref: f5802c5769c21d29b1fdf48d0f0d8c0ee25be017
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Собрать и опубликовать генератор с шаблонами
        run: |
          dotnet new globaljson --sdk-version 8.0.100 --roll-forward latestFeature
          dotnet --version
          dotnet build src/ADOGenerator/ADOGenerator.csproj -c Release
          dotnet publish src/ADOGenerator/ADOGenerator.csproj -c Release -r win-x64 --self-contained true -o dist
          test -s dist/ADOGenerator.exe
          test -s dist/Templates/Gen-PartsUnlimited/ProjectTemplate.json
          cp LICENSE dist/LICENSE-generator
      - uses: actions/upload-artifact@v4
        with:
          name: ADOGenerator-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
