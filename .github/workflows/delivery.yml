name: Календарь поставки веб-приложения
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/delivery.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: delivery-calendar
jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Согласовать итерации и проверить зависимость
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          """Prepare the two teams' delivery calendar from the repository backlog."""
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}"
          plan = "поставка веб-приложения"
          external = "External integrations"
          leave = "Команда в отпуске"

          def api(path, method="GET", payload=None):
              cmd = ["gh", "api", "--method", method, f"repos/{repo}/{path}"]
              if payload is not None:
                  cmd += ["--input", "-"]
              r = subprocess.run(cmd, text=True, input=json.dumps(payload) if payload is not None else None,
                                 capture_output=True, check=False)
              if r.returncode:
                  raise RuntimeError(f"{method} {path}: {r.stderr}")
              return json.loads(r.stdout) if r.stdout.strip() else None

          labels = {l["name"] for l in api("labels?per_page=100")}
          for name, color in [(plan,"168B8F"),(external,"326DAD"),(leave,"A63DAB")]:
              if name not in labels:
                  api("labels","POST",{"name":name,"color":color})
          milestones = {m["title"]:m for m in api("milestones?state=all&per_page=100")}
          periods = {"Итерация 50":("2026-11-23","2026-12-11"),
                     "Итерация 51":("2026-12-14","2027-01-01"),
                     leave:("2026-11-27","2026-11-27")}
          for name,(start,end) in periods.items():
              if name not in milestones:
                  milestones[name] = api("milestones","POST",{"title":name,"due_on":end+"T12:00:00Z",
                              "description":f"{start} — {end}. "+(external if name!=leave else "Календарная веха плана поставки.")})
          if not milestones["Sprint 4"].get("due_on"):
              api("milestones/"+str(milestones["Sprint 4"]["number"]),"PATCH",{"due_on":"2027-01-15T12:00:00Z"})
          def mid(name):
              return milestones[name]["number"]
          def tagged(row):
              return {label["name"] for label in row["labels"]}
          def pbi(n):
              row=api(f"issues/{n}")
              assert "type: Product Backlog Item" in tagged(row), n
              if plan not in tagged(row):
                  api(f"issues/{n}/labels","POST",{"labels":[plan]})
              return row
          main = {n:pbi(n) for n in [44,47,52,56,90,91,92]}
          track=main[47]
          assert "track status of the package" in track["title"] and track["state"]=="closed"
          present = {r["title"]:r for r in api("issues?state=all&per_page=100&labels="+quote(plan))}
          def create(title,body,initial,ls):
              return present.get(title) or api("issues","POST",{"title":title,"body":body,
                                      "milestone":mid(initial),"labels":[plan,*ls]})
          weather=create("Интеграция с метеорологической службой",
              "Подключить прогноз погоды для региона доставки. При недоступности сервиса заказ можно оформить обычным способом.",
              "Итерация 50",[external,"type: Product Backlog Item","state: New"])
          shipping=create("Интеграция с корпоративными данными доставок",
              "Получать идентификатор отправления, статус и время последнего обновления у корпоративной службы доставки. Эти данные нужны для отображения статуса посылки покупателю.",
              "Итерация 51",[external,"type: Product Backlog Item","state: New"])
          marker=create(leave,"Календарная веха веб-команды. Последняя пятница ноября — 27 ноября 2026 года.",leave,[leave])
          for row,dest in [(shipping,"Итерация 50"),(weather,"Итерация 51"),(track,"Sprint 4")]:
              if (row.get("milestone") or {}).get("number")!=mid(dest):
                  api(f"issues/{row['number']}","PATCH",{"milestone":mid(dest)})
          relation=f"issues/{track['number']}/dependencies/blocked_by"
          if shipping["id"] not in {r["id"] for r in api(relation)}:
              api(relation,"POST",{"issue_id":shipping["id"]})
          for row,dest in [(shipping,"Итерация 50"),(weather,"Итерация 51"),(track,"Sprint 4"),(marker,leave)]:
              saved=api(f"issues/{row['number']}")
              assert saved["milestone"]["title"]==dest and plan in tagged(saved)
          assert api("issues/47")["state"]=="closed"
          assert shipping["id"] in {r["id"] for r in api(relation)}
          def ref(r,caption=None):
              return f"[#{r['number']} {caption or r['title']}]({r['html_url']})"
          project="https://github.com/orgs/monin-1-lab/projects/3"
          dest=Path("delivery")
          dest.mkdir(exist_ok=True)
          lines=["# Поставка Веб-приложения","",
                 f"[Календарь открытых работ]({project}/views/1) · [Полный план]({project}/views/2) · [Итерации репозитория]({base}/milestones)","",
                 "Команда Unlimited Parts планирует функции интернет-магазина, а External integrations отвечает за внешние источники данных. В календарь включены истории и отдельная веха отпуска.","",
                 "## Календарь команд","","![Календарь двух команд с пурпурным маркером 27 ноября](calendar.png)","","| Команда | Период | Начало | Окончание |","| --- | --- | --- | --- |",
                 "| Unlimited Parts | Sprint 2 | 23.11.2026 | 09.12.2026 |","| Unlimited Parts | Sprint 3 | 10.12.2026 | 25.12.2026 |",
                 "| Unlimited Parts | Sprint 4 | 28.12.2026 | 15.01.2027 |","| External integrations | Итерация 50 | 23.11.2026 | 11.12.2026 |",
                 "| External integrations | Итерация 51 | 14.12.2026 | 01.01.2027 |","",f"Пурпурная веха {ref(marker)} приходится на последнюю пятницу ноября — 27.11.2026. Внешние итерации заканчиваются в третью пятницу от начала каждой итерации.","",
                 "## Изменение очерёдности поставки","","| История | Первоначально | После согласования |","| --- | --- | --- |",
                 f"| {ref(shipping)} | Итерация 51 | Итерация 50 |",f"| {ref(weather)} | Итерация 50 | Итерация 51 |",
                 f"| {ref(track,'Отслеживание статуса посылки')} | Sprint 1 | Sprint 4 |","",
                 "История отслеживания посылки использует данные корпоративной службы доставки. В GitHub Issues задана связь «blocked by». Интеграция запланирована до 11 декабря, а Sprint 4 начинается 28 декабря. Плановые интервалы зависимых работ больше не пересекаются.","",
                 "В представлении открытых работ действует фильтр по состоянию карточки. История отслеживания посылки сохранила исходный статус Closed и видна в полном плане.",""]
          (dest/"README.md").write_text("\n".join(lines),encoding="utf-8")
          print(f"Corporate #{shipping['number']}, weather #{weather['number']}, marker #{marker['number']}, tracking #47.")

      - name: Сохранить календарь команд
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Согласовать календарь команд и очередность поставки'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
