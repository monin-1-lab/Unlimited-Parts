name: Parts Unlimited CI-CD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/store-ci.yml']
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Inspect Windows runner and restore packages
        shell: pwsh
        run: |
          Write-Host "Runner $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH / image $env:ImageVersion"
          msbuild -version
          foreach ($config in 'app/src/PartsUnlimitedWebsite/packages.config','app/test/PartsUnlimited.UnitTests/packages.config') {
            nuget restore $config -PackagesDirectory app/packages -Source https://api.nuget.org/v3/index.json -NonInteractive
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Compile application and unit tests
        run: msbuild app/test/PartsUnlimited.UnitTests/PartsUnlimited.UnitTests.csproj /m /p:Configuration=Release /p:TargetFrameworkVersion=v4.8 "/p:SolutionDir=$pwd/app/"
      - name: Run MSTest and record results
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -property installationPath
          $vstest = Join-Path $vs 'Common7/IDE/Extensions/TestPlatform/vstest.console.exe'
          $adapter = Get-ChildItem app/packages/MSTest.TestAdapter*/ -Recurse -Filter Microsoft.VisualStudio.TestPlatform.MSTest.TestAdapter.dll | Select-Object -First 1
          if (!$adapter) { throw 'MSTest adapter missing' }
          & $vstest app/test/PartsUnlimited.UnitTests/bin/Release/PartsUnlimited.UnitTests.dll "/TestAdapterPath:$($adapter.DirectoryName)" /Logger:trx /ResultsDirectory:results
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [xml]$trx = Get-Content (Get-ChildItem results/*.trx | Select-Object -First 1).FullName -Raw
          $counts = $trx.TestRun.ResultSummary.Counters
          if ([int]$counts.passed -lt 1) { throw 'No passing tests recorded' }
          "MSTest: $($counts.passed) passed, $($counts.failed) failed." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/*.trx
      - name: Package ASP.NET website
        run: msbuild app/src/PartsUnlimitedWebsite/PartsUnlimitedWebsite.csproj /p:Configuration=Release /p:TargetFrameworkVersion=v4.8 "/p:SolutionDir=$pwd/app/" /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem "/p:PublishUrl=$pwd/site" /p:DeployDefaultTarget=WebPublish
      - uses: actions/upload-artifact@v4
        with:
          name: store-website
          path: site/
          if-no-files-found: error
  deploy:
    name: Deploy to temporary IIS Express
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-website
          path: site
      - name: Start SQL LocalDB and verify the storefront
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = (Resolve-Path site).Path
          $index = Get-Content "$root/Views/Home/Index.cshtml" -Raw
          $title = [regex]::Match($index, 'ViewBag\.Title\s*=\s*"([^"]+)"').Groups[1].Value
          if (!$title) { throw 'Missing home page title' }
          $server = Start-Process "$env:ProgramFiles/IIS Express/iisexpress.exe" -ArgumentList "/path:`"$root`" /port:8085" -PassThru
          try {
            for ($i=0; $i -lt 12; $i++) {
              try { $page = Invoke-WebRequest http://localhost:8085/ -TimeoutSec 40; break }
              catch { if ($i -eq 11 -or $server.HasExited) { throw }; Start-Sleep 3 }
            }
            $html = [Net.WebUtility]::HtmlDecode($page.Content)
            if ($page.StatusCode -ne 200 -or !$html.Contains($title) -or !$html.Contains('jumbotron-carousel')) { throw 'Unexpected storefront response' }
            "HTTP 200 | $title | IIS Express + SQL LocalDB | commit $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
            $page.Content | Set-Content storefront.html -Encoding utf8
          } finally { if (!$server.HasExited) { $server.Kill() } }
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-response
          path: storefront.html
